<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="80%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>

    <!-- Path Linear Gradients -->
    <linearGradient id="gradPath1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="gradPath2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#56d364" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="gradPath3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#d2a8ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>

    <!-- Vector Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#58a6ff" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#3fb950" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#bc8cff" />
    </marker>

    <!-- Dot Lattice Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b949e" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* Stochastic Brownian Flow Animation */
    .stochastic-line-1 {
      stroke-dasharray: 12 8;
      animation: dashTravel 24s linear infinite;
    }
    .stochastic-line-2 {
      stroke-dasharray: 8 6;
      animation: dashTravel 18s linear infinite reverse;
    }
    .stochastic-line-3 {
      stroke-dasharray: 14 10;
      animation: dashTravel 30s linear infinite;
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -400; }
    }

    /* Geometric Vector Orthogonalization Rotation */
    .orthogonalizing-vector {
      transform-origin: 185px 150px;
      animation: lowdinRotate 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes lowdinRotate {
      0%, 18% { transform: rotate(-28deg); }
      45%, 72% { transform: rotate(0deg); }
      92%, 100% { transform: rotate(-28deg); }
    }

    /* Metric State Transition (Collinear -> Orthonormal) */
    .state-collinear {
      animation: stateCollinear 10s ease-in-out infinite;
    }
    .state-orthonormal {
      animation: stateOrtho 10s ease-in-out infinite;
    }
    @keyframes stateCollinear {
      0%, 22% { opacity: 1; transform: translateY(0); }
      38%, 78% { opacity: 0; transform: translateY(-4px); }
      90%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes stateOrtho {
      0%, 25% { opacity: 0; transform: translateY(4px); }
      42%, 75% { opacity: 1; transform: translateY(0); }
      88%, 100% { opacity: 0; transform: translateY(4px); }
    }

    /* Right-angle Orthogonality Marker Fade */
    .angle-marker {
      animation: markerGlow 10s ease-in-out infinite;
    }
    @keyframes markerGlow {
      0%, 25% { opacity: 0; stroke-opacity: 0; }
      45%, 72% { opacity: 1; stroke-opacity: 0.9; }
      90%, 100% { opacity: 0; stroke-opacity: 0; }
    }

    /* Terminal Line Crossfade */
    .term-line-1 { animation: cycleLine1 12s ease-in-out infinite; }
    .term-line-2 { animation: cycleLine2 12s ease-in-out infinite; }
    .term-line-3 { animation: cycleLine3 12s ease-in-out infinite; }

    @keyframes cycleLine1 {
      0%, 29% { opacity: 1; transform: translateY(0); }
      33%, 96% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycleLine2 {
      0%, 29% { opacity: 0; transform: translateY(5px); }
      33%, 62% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes cycleLine3 {
      0%, 62% { opacity: 0; transform: translateY(5px); }
      66%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-5px); }
    }

    /* Pulse Live Dot */
    .pulse-dot {
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 3.5; }
      50% { opacity: 1; r: 4.5; }
      100% { opacity: 0.4; r: 3.5; }
    }

    /* Blinking Cursor */
    .blink-cursor {
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <!-- 1. Background Container -->
  <rect x="1" y="1" width="958" height="258" rx="14" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="958" height="258" rx="14" fill="url(#dotGrid)" />
  <rect x="1" y="1" width="958" height="258" rx="14" fill="url(#glowCyan)" />
  <rect x="1" y="1" width="958" height="258" rx="14" fill="url(#glowEmerald)" />

  <!-- 2. Stochastic Flow Waves (Brownian Motion / Monte Carlo paths in background) -->
  <g fill="none" stroke-linecap="round">
    <!-- Path 1 (Cyan / Asset Drift 1) -->
    <path class="stochastic-line-1" stroke="url(#gradPath1)" stroke-width="2"
          d="M-20,130 Q120,70 240,115 T500,100 T760,145 T1000,90" />
    
    <!-- Path 2 (Emerald / Volatility Path 2) -->
    <path class="stochastic-line-2" stroke="url(#gradPath2)" stroke-width="1.6"
          d="M-20,175 Q160,210 320,165 T620,195 T840,130 T1000,160" />
    
    <!-- Path 3 (Violet / BDT Short-Rate Lattice Path 3) -->
    <path class="stochastic-line-3" stroke="url(#gradPath3)" stroke-width="1.4"
          d="M-20,95 Q180,140 380,80 T680,120 T890,75 T1000,110" />

    <!-- Subtle Barrier / Cliquet Local Cap-Floor Guide Line -->
    <line x1="40" y1="60" x2="920" y2="60" stroke="#30363d" stroke-dasharray="3 6" stroke-width="1" stroke-opacity="0.45" />
    <line x1="40" y1="210" x2="920" y2="210" stroke="#30363d" stroke-dasharray="3 6" stroke-width="1" stroke-opacity="0.45" />
  </g>

  <!-- 3. Left Section: Geometric Orthogonalization Visualizer (Stiefel Manifold / SVD) -->
  <g id="geometric-visualizer">
    <!-- Isometric Ellipsoid Grid (Unit Ball / Covariance Metric) -->
    <ellipse cx="185" cy="150" rx="90" ry="34" fill="rgba(88, 166, 255, 0.02)" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 3" />
    <ellipse cx="185" cy="150" rx="60" ry="85" fill="none" stroke="#bc8cff" stroke-width="0.8" stroke-opacity="0.18" stroke-dasharray="3 4" transform="rotate(-15 185 150)" />

    <!-- 3D Coordinate Axis Lines -->
    <line x1="185" y1="150" x2="185" y2="52" stroke="#484f58" stroke-width="1.5" />
    <line x1="185" y1="150" x2="295" y2="150" stroke="#484f58" stroke-width="1.5" />
    <line x1="185" y1="150" x2="95" y2="198" stroke="#484f58" stroke-width="1.5" />

    <!-- Axis Labels -->
    <text x="185" y="44" fill="#8b949e" font-size="10" text-anchor="middle" class="mono">e₂</text>
    <text x="304" y="154" fill="#8b949e" font-size="10" text-anchor="start" class="mono">e₁</text>
    <text x="88" y="206" fill="#8b949e" font-size="10" text-anchor="end" class="mono">e₃</text>

    <!-- Right Angle Orthogonality Indicator Symbol (Löwdin Basis) -->
    <path class="angle-marker" d="M197,150 L197,138 L185,138" fill="none" stroke="#3fb950" stroke-width="1.75" />

    <!-- Static Fixed Factor Vector f2 (Vertical Basis, Emerald) -->
    <line x1="185" y1="150" x2="185" y2="70" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowEmerald)" />
    <text x="175" y="74" fill="#56d364" font-size="11" font-weight="bold" text-anchor="end" class="mono">q₂</text>

    <!-- Static Third Factor Vector f3 (Deep Z-Axis, Purple) -->
    <line x1="185" y1="150" x2="115" y2="188" stroke="#bc8cff" stroke-width="2.2" marker-end="url(#arrowPurple)" />
    <text x="105" y="186" fill="#d2a8ff" font-size="11" font-weight="bold" text-anchor="end" class="mono">q₃</text>

    <!-- Dynamic Rotating Factor Vector f1 (Löwdin Polar SVD Rotation: Collinear -> Orthonormal) -->
    <g class="orthogonalizing-vector">
      <line x1="185" y1="150" x2="275" y2="150" stroke="#58a6ff" stroke-width="2.6" marker-end="url(#arrowCyan)" />
      <!-- Projection trace drop line -->
      <line x1="275" y1="150" x2="275" y2="162" stroke="#58a6ff" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6" />
      <text x="282" y="146" fill="#79c0ff" font-size="11" font-weight="bold" class="mono">q₁</text>
    </g>

    <!-- Coordinate Center Node -->
    <circle cx="185" cy="150" r="3.5" fill="#f0f6fc" />

    <!-- Real-time Mathematical State Indicator Display Box -->
    <g transform="translate(185, 222)">
      <!-- Collinear State Tag -->
      <g class="state-collinear">
        <rect x="-82" y="-12" width="164" height="20" rx="10" fill="rgba(248, 81, 73, 0.12)" stroke="#f85149" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="-68" cy="-2" r="3" fill="#f85149" />
        <text x="-56" y="2" fill="#ff7b72" font-size="9.5" font-weight="600" class="mono">COLLINEAR: κ₂=18.5</text>
      </g>
      <!-- Orthonormal State Tag -->
      <g class="state-orthonormal">
        <rect x="-82" y="-12" width="164" height="20" rx="10" fill="rgba(63, 185, 80, 0.12)" stroke="#3fb950" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="-68" cy="-2" r="3" fill="#3fb950" />
        <text x="-56" y="2" fill="#56d364" font-size="9.5" font-weight="600" class="mono">LÖWDIN: κ₂=1.000 (I_K)</text>
      </g>
    </g>
  </g>

  <!-- Divider line separating Graphic and Profile Info -->
  <line x1="365" y1="36" x2="365" y2="224" stroke="#30363d" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="4 6" />

  <!-- 4. Right Section: Profile Identity & Quant Terminal CLI -->
  <g transform="translate(395, 0)">
    <!-- Top Pill Badge: Institutional Specialization -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="310" height="22" rx="11" fill="rgba(88, 166, 255, 0.1)" stroke="rgba(88, 166, 255, 0.35)" stroke-width="1" />
      <circle class="pulse-dot" cx="12" cy="11" r="4" fill="#3fb950" />
      <text x="24" y="14.5" fill="#58a6ff" font-size="9.5" font-weight="bold" letter-spacing="0.6" class="mono">
        QUANTITATIVE RESEARCH &amp; NUMERICAL ANALYSIS
      </text>
    </g>

    <!-- Name Heading -->
    <text x="0" y="84" fill="url(#textGrad)" font-size="28" font-weight="800" letter-spacing="-0.5" class="sans">
      Phan Bùi Hữu Ân
    </text>

    <!-- Education / Tagline -->
    <text x="0" y="106" fill="#8b949e" font-size="12" font-weight="500" class="sans">
      B.S. Mathematics (Talent Program) • Numerical Analysis Specialization
    </text>

    <!-- Interactive Terminal CLI Box -->
    <g transform="translate(0, 122)">
      <!-- Terminal Background Window -->
      <rect x="0" y="0" width="530" height="74" rx="8" fill="rgba(13, 17, 23, 0.85)" stroke="#30363d" stroke-width="1.2" />
      
      <!-- Terminal Header Bar -->
      <rect x="0" y="0" width="530" height="22" rx="8" fill="rgba(22, 27, 34, 0.85)" />
      <!-- Traffic Light Buttons -->
      <circle cx="12" cy="11" r="3.5" fill="#ff5f56" />
      <circle cx="23" cy="11" r="3.5" fill="#ffbd2e" />
      <circle cx="34" cy="11" r="3.5" fill="#27c93f" />
      <!-- Header Title -->
      <text x="265" y="15" fill="#6e7681" font-size="9.5" text-anchor="middle" class="mono">
        huuan26@quant-research: ~/models
      </text>

      <!-- Terminal Body Content (Crossfading Dynamic Code Execution) -->
      <!-- Prompt Symbol -->
      <text x="14" y="44" fill="#58a6ff" font-size="11.5" font-weight="bold" class="mono">&gt;</text>

      <!-- Cycle Line 1: OrthoQuant Engine -->
      <g class="term-line-1" transform="translate(28, 44)">
        <text fill="#f0f6fc" font-size="11" class="mono">
          <tspan fill="#79c0ff">orthoquant</tspan>.<tspan fill="#d2a8ff">lowdin_orthogonalize</tspan>(F) <tspan fill="#8b949e"># VIF: ∞ → 1.000</tspan>
        </text>
        <text x="0" y="18" fill="#3fb950" font-size="10" class="mono">
          ✔ Thin SVD polar decomposition: F_tilde = U·Vᵀ (optimal)
        </text>
      </g>

      <!-- Cycle Line 2: FinancePy Contributions -->
      <g class="term-line-2" transform="translate(28, 44)">
        <text fill="#f0f6fc" font-size="11" class="mono">
          <tspan fill="#79c0ff">financepy</tspan>.<tspan fill="#d2a8ff">curves</tspan>.<tspan fill="#56d364">CDSCurve</tspan>(df, survival_prob)
        </text>
        <text x="0" y="18" fill="#3fb950" font-size="10" class="mono">
          ✔ PR #408 merged: aligned day-count &amp; list[Date] vectorization
        </text>
      </g>

      <!-- Cycle Line 3: Cliquet & BDT Pricing -->
      <g class="term-line-3" transform="translate(28, 44)">
        <text fill="#f0f6fc" font-size="11" class="mono">
          <tspan fill="#79c0ff">pricer</tspan>.<tspan fill="#d2a8ff">simulate</tspan>(bdt_tree, cliquet_cap_floor)
        </text>
        <text x="0" y="18" fill="#bc8cff" font-size="10" class="mono">
          ✔ PR #406 (Shifted BDT) &amp; PR #404 (Cliquet Valuation) active
        </text>
      </g>
    </g>

    <!-- Bottom Pill Skills -->
    <g transform="translate(0, 208)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="102" height="20" rx="5" fill="rgba(88, 166, 255, 0.08)" stroke="rgba(88, 166, 255, 0.25)" stroke-width="1" />
      <text x="51" y="13.5" fill="#79c0ff" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Matrix SVD / QR</text>

      <!-- Pill 2 -->
      <rect x="110" y="0" width="124" height="20" rx="5" fill="rgba(63, 185, 80, 0.08)" stroke="rgba(63, 185, 80, 0.25)" stroke-width="1" />
      <text x="172" y="13.5" fill="#56d364" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Risk Neutralization</text>

      <!-- Pill 3 -->
      <rect x="242" y="0" width="138" height="20" rx="5" fill="rgba(188, 140, 255, 0.08)" stroke="rgba(188, 140, 255, 0.25)" stroke-width="1" />
      <text x="311" y="13.5" fill="#d2a8ff" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Derivatives Pricing</text>

      <!-- Pill 4 -->
      <rect x="388" y="0" width="112" height="20" rx="5" fill="rgba(210, 153, 34, 0.08)" stroke="rgba(210, 153, 34, 0.25)" stroke-width="1" />
      <text x="444" y="13.5" fill="#e3b341" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">Stochastic ODEs</text>
    </g>
  </g>
</svg>
