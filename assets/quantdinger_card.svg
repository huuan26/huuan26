<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="qdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c1524" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="qdGlowCyan" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="qdGlowEmerald" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Lattice -->
    <pattern id="qdGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b949e" fill-opacity="0.07" />
    </pattern>

    <!-- Indicator Line Gradients -->
    <linearGradient id="emaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="hmaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* Candlestick Flow Simulation */
    .candle-stream {
      animation: candleSlide 10s linear infinite;
    }
    @keyframes candleSlide {
      0% { transform: translateX(0); }
      100% { transform: translateX(-60px); }
    }

    /* Dynamic Indicator Waves */
    .indicator-wave {
      stroke-dasharray: 8 4;
      animation: waveDash 14s linear infinite;
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -120; }
    }

    /* Dynamic Warmup Buffer Bar filling animation */
    .warmup-progress {
      animation: warmupFill 6s ease-in-out infinite;
    }
    @keyframes warmupFill {
      0%, 20% { width: 45px; }
      60%, 85% { width: 140px; }
      95%, 100% { width: 45px; }
    }

    /* Live Execution Beacon */
    .live-beacon {
      animation: beaconPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 5px #3fb950); }
    }

    /* Alternating Metrics display */
    .metric-cycle-1 { animation: cycleM1 8s ease-in-out infinite; }
    .metric-cycle-2 { animation: cycleM2 8s ease-in-out infinite; }
    @keyframes cycleM1 {
      0%, 45% { opacity: 1; transform: translateY(0); }
      50%, 95% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycleM2 {
      0%, 45% { opacity: 0; transform: translateY(4px); }
      50%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(4px); }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#qdBg)" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#qdGrid)" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#qdGlowCyan)" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#qdGlowEmerald)" />

  <!-- Title & Header -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="4" fill="#3fb950" class="live-beacon" />
    <text x="16" y="8" fill="#e6edf3" font-size="12" font-weight="700" class="sans" letter-spacing="0.5">ALGO TRADING OS &amp; MULTI-TIMEFRAME ALPHA ENGINE</text>
    <rect x="420" y="-4" width="148" height="18" rx="9" fill="rgba(63, 185, 80, 0.12)" stroke="#3fb950" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="494" y="8" fill="#3fb950" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">QUANTDINGER V2</text>
  </g>

  <!-- LEFT VISUALIZER: Multi-Timeframe Candlestick & Indicator Flow -->
  <g transform="translate(30, 48)">
    <text x="0" y="8" fill="#8b949e" font-size="10" font-weight="600" class="mono">MULTI-TIMEFRAME STREAMING &amp; LOOKBACK WARMUP</text>

    <!-- Candlestick Window Background -->
    <rect x="0" y="18" width="280" height="106" rx="6" fill="rgba(13, 19, 30, 0.7)" stroke="#21262d" stroke-width="0.8" />
    
    <!-- Timeframe Tags -->
    <g transform="translate(8, 28)">
      <rect x="0" y="0" width="34" height="14" rx="3" fill="#21262d" />
      <text x="17" y="10" fill="#58a6ff" font-size="8" font-weight="700" text-anchor="middle" class="mono">1m</text>
      
      <rect x="40" y="0" width="34" height="14" rx="3" fill="#21262d" />
      <text x="57" y="10" fill="#8b949e" font-size="8" font-weight="700" text-anchor="middle" class="mono">1h</text>

      <rect x="80" y="0" width="48" height="14" rx="3" fill="rgba(63, 185, 80, 0.15)" stroke="#3fb950" stroke-width="0.6" />
      <text x="104" y="10" fill="#3fb950" font-size="8" font-weight="700" text-anchor="middle" class="mono">1M (N=12)</text>
    </g>

    <!-- Sliding Candlestick Stream -->
    <g class="candle-stream" transform="translate(10, 48)">
      <!-- Candle 1: Bullish -->
      <line x1="20" y1="12" x2="20" y2="48" stroke="#3fb950" stroke-width="1.2" />
      <rect x="16" y="20" width="8" height="20" fill="#3fb950" rx="1" />
      <!-- Candle 2: Bearish -->
      <line x1="40" y1="18" x2="40" y2="58" stroke="#f85149" stroke-width="1.2" />
      <rect x="36" y="26" width="8" height="24" fill="#f85149" rx="1" />
      <!-- Candle 3: Bullish -->
      <line x1="60" y1="10" x2="60" y2="44" stroke="#3fb950" stroke-width="1.2" />
      <rect x="56" y="16" width="8" height="18" fill="#3fb950" rx="1" />
      <!-- Candle 4: Bullish -->
      <line x1="80" y1="8" x2="80" y2="38" stroke="#3fb950" stroke-width="1.2" />
      <rect x="76" y="12" width="8" height="20" fill="#3fb950" rx="1" />
      <!-- Candle 5: Bearish -->
      <line x1="100" y1="15" x2="100" y2="52" stroke="#f85149" stroke-width="1.2" />
      <rect x="96" y="20" width="8" height="22" fill="#f85149" rx="1" />
      <!-- Candle 6: Bullish -->
      <line x1="120" y1="6" x2="120" y2="38" stroke="#3fb950" stroke-width="1.2" />
      <rect x="116" y="10" width="8" height="18" fill="#3fb950" rx="1" />
      <!-- Candle 7: Bullish -->
      <line x1="140" y1="2" x2="140" y2="32" stroke="#3fb950" stroke-width="1.2" />
      <rect x="136" y="6" width="8" height="20" fill="#3fb950" rx="1" />
      <!-- Candle 8: Bearish -->
      <line x1="160" y1="12" x2="160" y2="46" stroke="#f85149" stroke-width="1.2" />
      <rect x="156" y="18" width="8" height="18" fill="#f85149" rx="1" />
      <!-- Candle 9: Bullish -->
      <line x1="180" y1="4" x2="180" y2="34" stroke="#3fb950" stroke-width="1.2" />
      <rect x="176" y="8" width="8" height="20" fill="#3fb950" rx="1" />
      <!-- Candle 10: Bullish -->
      <line x1="200" y1="2" x2="200" y2="28" stroke="#3fb950" stroke-width="1.2" />
      <rect x="196" y="5" width="8" height="16" fill="#3fb950" rx="1" />
      <!-- Candle 11 -->
      <line x1="220" y1="8" x2="220" y2="40" stroke="#f85149" stroke-width="1.2" />
      <rect x="216" y="14" width="8" height="18" fill="#f85149" rx="1" />
      <!-- Candle 12 -->
      <line x1="240" y1="2" x2="240" y2="30" stroke="#3fb950" stroke-width="1.2" />
      <rect x="236" y="6" width="8" height="18" fill="#3fb950" rx="1" />
      <!-- Candle 13 -->
      <line x1="260" y1="1" x2="260" y2="24" stroke="#3fb950" stroke-width="1.2" />
      <rect x="256" y="4" width="8" height="15" fill="#3fb950" rx="1" />
      <!-- Candle 14 -->
      <line x1="280" y1="5" x2="280" y2="32" stroke="#3fb950" stroke-width="1.2" />
      <rect x="276" y="8" width="8" height="16" fill="#3fb950" rx="1" />
      <!-- Candle 15 -->
      <line x1="300" y1="1" x2="300" y2="26" stroke="#3fb950" stroke-width="1.2" />
      <rect x="296" y="4" width="8" height="14" fill="#3fb950" rx="1" />
    </g>

    <!-- Overlay Indicator Curves (EMA / HMA) -->
    <path d="M15,92 Q70,82 120,68 T200,56 T275,44" fill="none" stroke="url(#emaGrad)" stroke-width="1.8" class="indicator-wave" />
    <path d="M15,98 Q65,92 110,75 T190,62 T275,50" fill="none" stroke="url(#hmaGrad)" stroke-width="1.4" stroke-opacity="0.8" />

    <text x="8" y="138" fill="#6e7681" font-size="8" class="mono">Duration: 2,592,000s • EMA / HMA / TEMA Synchronized</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="330" y1="25" x2="330" y2="168" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6" />

  <!-- RIGHT VISUALIZER: Dynamic Warmup Calibration & Annualized Metrics -->
  <g transform="translate(355, 48)">
    <text x="0" y="8" fill="#8b949e" font-size="10" font-weight="600" class="mono">DYNAMIC FACTOR WARMUP &amp; ANNUALIZED PERFORMANCE HUD</text>

    <!-- Metric HUD Box 1: Annualization Alignment -->
    <g transform="translate(10, 22)">
      <rect x="0" y="0" width="235" height="48" rx="6" fill="rgba(13, 20, 36, 0.85)" stroke="#30363d" stroke-width="0.9" />
      <text x="12" y="16" fill="#8b949e" font-size="8.5" class="mono">Annualization Scaling (V2)</text>
      <text x="12" y="36" fill="#58a6ff" font-size="11" font-weight="700" class="mono">N = 12.0 (Monthly Duration)</text>
      <rect x="180" y="10" width="44" height="16" rx="4" fill="rgba(88, 166, 255, 0.15)" stroke="#58a6ff" stroke-width="0.6" />
      <text x="202" y="21" fill="#79c0ff" font-size="8" font-weight="600" text-anchor="middle" class="mono">ALIGNED</text>
    </g>

    <!-- Metric HUD Box 2: Warmup Gauge -->
    <g transform="translate(260, 22)">
      <rect x="0" y="0" width="245" height="48" rx="6" fill="rgba(13, 20, 36, 0.85)" stroke="#30363d" stroke-width="0.9" />
      <text x="12" y="16" fill="#8b949e" font-size="8.5" class="mono">Indicator Warmup Buffer (Dynamic)</text>
      <!-- Progress Bar Track -->
      <rect x="12" y="24" width="150" height="8" rx="4" fill="#21262d" />
      <rect x="12" y="24" width="140" height="8" rx="4" fill="#3fb950" class="warmup-progress" />
      <text x="170" y="32" fill="#3fb950" font-size="9" font-weight="700" class="mono">100% Ready</text>
    </g>

    <!-- Lower Alternating Console Display -->
    <g transform="translate(10, 78)">
      <rect x="0" y="0" width="495" height="44" rx="6" fill="rgba(9, 14, 24, 0.9)" stroke="#21262d" stroke-width="0.9" />
      <!-- Cycle 1 -->
      <g class="metric-cycle-1">
        <circle cx="16" cy="22" r="3.5" fill="#3fb950" />
        <text x="28" y="18" fill="#c9d1d9" font-size="9" font-weight="600" class="mono">Strategy Backtest Engine:</text>
        <text x="28" y="32" fill="#56d364" font-size="10" font-weight="700" class="mono">Annualized Sharpe: 2.48 • Sortino: 3.15 • Calmar: 4.20 • Vol: 11.2%</text>
      </g>
      <!-- Cycle 2 -->
      <g class="metric-cycle-2">
        <circle cx="16" cy="22" r="3.5" fill="#58a6ff" />
        <text x="28" y="18" fill="#c9d1d9" font-size="9" font-weight="600" class="mono">Dynamic Factor Feeds:</text>
        <text x="28" y="32" fill="#79c0ff" font-size="10" font-weight="700" class="mono">Zero Lookahead Bias Verified • Full Hierarchy Driving Frequency V2</text>
      </g>
    </g>

    <!-- Bottom Specs Ribbon -->
    <text x="12" y="138" fill="#8b949e" font-size="8.5" class="mono">PRs #294, #298 • Merged to OpenByteInc/QuantDinger • Strategy API V2</text>
  </g>
</svg>
