<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="optiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#121024" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="optiGlowPurple" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="optiGlowCyan" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Lattice -->
    <pattern id="optiGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b949e" fill-opacity="0.07" />
    </pattern>

    <!-- Gradient for FISTA Convergence Path -->
    <linearGradient id="fistaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* FISTA Gradient Descent Step Pulse */
    .fista-step-1 { animation: stepGlow 4s ease-in-out infinite; }
    .fista-step-2 { animation: stepGlow 4s ease-in-out infinite 0.7s; }
    .fista-step-3 { animation: stepGlow 4s ease-in-out infinite 1.4s; }
    .fista-step-opt { animation: optPulse 4s ease-in-out infinite 2.1s; }

    @keyframes stepGlow {
      0%, 15% { opacity: 0.2; r: 3; }
      30%, 80% { opacity: 1; r: 4.5; }
      95%, 100% { opacity: 0.2; r: 3; }
    }
    @keyframes optPulse {
      0%, 25% { opacity: 0.2; r: 4; fill: #3fb950; }
      50%, 85% { opacity: 1; r: 6.5; fill: #56d364; filter: drop-shadow(0 0 5px #3fb950); }
      95%, 100% { opacity: 0.2; r: 4; fill: #3fb950; }
    }

    /* FISTA trajectory path dash */
    .fista-path {
      stroke-dasharray: 6 3;
      animation: fistaDash 8s linear infinite;
    }
    @keyframes fistaDash {
      to { stroke-dashoffset: -90; }
    }

    /* ENF Diversification Gauge Animation */
    .enf-gauge {
      animation: enfFill 7s ease-in-out infinite;
    }
    @keyframes enfFill {
      0%, 20% { width: 45px; }
      55%, 85% { width: 140px; }
      95%, 100% { width: 45px; }
    }

    /* Alternating Allocator Console */
    .alloc-cycle-1 { animation: cycleA1 8s ease-in-out infinite; }
    .alloc-cycle-2 { animation: cycleA2 8s ease-in-out infinite; }
    @keyframes cycleA1 {
      0%, 45% { opacity: 1; transform: translateY(0); }
      50%, 95% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycleA2 {
      0%, 45% { opacity: 0; transform: translateY(4px); }
      50%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(4px); }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#optiBg)" stroke="#30363d" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#optiGrid)" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#optiGlowPurple)" />
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#optiGlowCyan)" />

  <!-- Title & Header -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="4" fill="#bc8cff" />
    <text x="16" y="8" fill="#e6edf3" font-size="12" font-weight="700" class="sans" letter-spacing="0.5">CONVEX REGULARIZED ALPHA COMBINATION &amp; ALLOCATION ENGINE</text>
    <rect x="525" y="-4" width="138" height="18" rx="9" fill="rgba(188, 140, 255, 0.12)" stroke="#bc8cff" stroke-width="0.8" stroke-opacity="0.4" />
    <text x="594" y="8" fill="#bc8cff" font-size="9.5" font-weight="600" text-anchor="middle" class="mono">OPTIALPHA</text>
  </g>

  <!-- LEFT VISUALIZER: FISTA Convex Contour & L1 Turnover Diamond -->
  <g transform="translate(30, 48)">
    <text x="0" y="8" fill="#8b949e" font-size="10" font-weight="600" class="mono">CONVEX TURNOVER LOSS CONTOUR &amp; FISTA SOLVER</text>

    <!-- Parabolic Loss Ellipses (Factor Risk Contours) -->
    <ellipse cx="140" cy="85" rx="100" ry="46" fill="none" stroke="#21262d" stroke-width="1" />
    <ellipse cx="140" cy="85" rx="72" ry="34" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.7" />
    <ellipse cx="140" cy="85" rx="45" ry="22" fill="none" stroke="rgba(188, 140, 255, 0.3)" stroke-width="1.2" />

    <!-- L1 Turnover Constraint Diamond centered at w_prev -->
    <polygon points="140,55 175,85 140,115 105,85" fill="rgba(88, 166, 255, 0.08)" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="108" y="70" fill="#79c0ff" font-size="8" class="mono">||w - w_prev||₁ ≤ τ</text>

    <!-- FISTA Convergence Path -->
    <path d="M60,40 Q105,65 118,72 T132,80 T140,85" fill="none" stroke="url(#fistaGrad)" stroke-width="2" class="fista-path" />

    <!-- FISTA Iteration Points -->
    <circle cx="60" cy="40" r="3.5" fill="#f0883e" class="fista-step-1" />
    <text x="48" y="32" fill="#ffa657" font-size="7.5" class="mono">w⁽⁰⁾</text>

    <circle cx="105" cy="65" r="4" fill="#bc8cff" class="fista-step-2" />
    <text x="96" y="58" fill="#d2a8ff" font-size="7.5" class="mono">w⁽ᵏ⁾</text>

    <circle cx="125" cy="76" r="4" fill="#58a6ff" class="fista-step-3" />

    <!-- Optimal Solution Node w* -->
    <circle cx="140" cy="85" r="5" fill="#3fb950" class="fista-step-opt" />
    <text x="148" y="96" fill="#56d364" font-size="9" font-weight="700" class="mono">w*</text>

    <!-- Axis labels -->
    <text x="24" y="138" fill="#6e7681" font-size="8" class="mono">Objective: max w^T ic - γ w^T Ω w - λ_turnover ||w - w_prev||₁</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="330" y1="25" x2="330" y2="168" stroke="#30363d" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.6" />

  <!-- RIGHT VISUALIZER: Ledoit-Wolf Shrinkage & Meucci ENF Gauge -->
  <g transform="translate(355, 48)">
    <text x="0" y="8" fill="#8b949e" font-size="10" font-weight="600" class="mono">ANALYTICAL SHRINKAGE &amp; MEUCCI ENF ATTRIBUTION</text>

    <!-- Metric HUD Box 1: Ledoit-Wolf Shrinkage -->
    <g transform="translate(10, 22)">
      <rect x="0" y="0" width="240" height="50" rx="6" fill="rgba(18, 16, 36, 0.85)" stroke="#30363d" stroke-width="0.9" />
      <text x="12" y="16" fill="#8b949e" font-size="8.5" class="mono">Ledoit–Wolf Shrinkage Target</text>
      <text x="12" y="36" fill="#bc8cff" font-size="11" font-weight="700" class="mono">Ω_α = (1-δ)S + δF (SPD Safe)</text>
      <rect x="178" y="10" width="50" height="16" rx="4" fill="rgba(188, 140, 255, 0.15)" stroke="#bc8cff" stroke-width="0.6" />
      <text x="203" y="21" fill="#d2a8ff" font-size="8" font-weight="600" text-anchor="middle" class="mono">δ*=0.18</text>
    </g>

    <!-- Metric HUD Box 2: Meucci ENF Gauge -->
    <g transform="translate(265, 22)">
      <rect x="0" y="0" width="240" height="50" rx="6" fill="rgba(18, 16, 36, 0.85)" stroke="#30363d" stroke-width="0.9" />
      <text x="12" y="16" fill="#8b949e" font-size="8.5" class="mono">Meucci Effective Number of Alphas (ENF)</text>
      <!-- Progress Bar Track -->
      <rect x="12" y="26" width="140" height="7" rx="3.5" fill="#21262d" />
      <rect x="12" y="26" width="140" height="7" rx="3.5" fill="#3fb950" class="enf-gauge" />
      <text x="160" y="33" fill="#3fb950" font-size="9" font-weight="700" class="mono">ENF = 4.7 / 5</text>
    </g>

    <!-- Lower Alternating Console Display -->
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="495" height="42" rx="6" fill="rgba(9, 14, 24, 0.9)" stroke="#21262d" stroke-width="0.9" />
      <!-- Cycle 1 -->
      <g class="alloc-cycle-1">
        <circle cx="16" cy="21" r="3.5" fill="#3fb950" />
        <text x="28" y="17" fill="#c9d1d9" font-size="8.5" font-weight="600" class="mono">The OrthoQuant Closed-Form Connection:</text>
        <text x="28" y="31" fill="#56d364" font-size="9.5" font-weight="700" class="mono">F_tilde^T F_tilde = I_K ⟹ Ω_α = Diag(σ_k²) ⟹ w_k* = IC_k / σ_k² (Zero Matrix Inversion)</text>
      </g>
      <!-- Cycle 2 -->
      <g class="alloc-cycle-2">
        <circle cx="16" cy="21" r="3.5" fill="#58a6ff" />
        <text x="28" y="17" fill="#c9d1d9" font-size="8.5" font-weight="600" class="mono">Online Adaptive Allocation:</text>
        <text x="28" y="31" fill="#79c0ff" font-size="9.5" font-weight="700" class="mono">Exponentiated Gradient Descent • Sublinear Regret O(√(T ln K)) • Bandit Exploration</text>
      </g>
    </g>

    <!-- Bottom Specs Ribbon -->
    <text x="12" y="138" fill="#8b949e" font-size="8.5" class="mono">FISTA / SLSQP Solvers • Box Constraints • 61 Passed Tests (99.6% Cov)</text>
  </g>
</svg>
